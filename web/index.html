<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI QA Release Risk &amp; Test Strategy</title>
    <meta
      name="description"
      content="A workspace where QA and product teams assess release risk from supplied evidence. A deterministic QA gate makes the final release decision."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%2317365D'/%3E%3Cpath d='M4.3 8.4l2.2 2.2 5-5' stroke='white' stroke-width='1.7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app" id="app">
      <header class="topbar">
        <div class="container topbar__inner">
          <div class="topbar__brand">
            <span class="topbar__mark" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></svg>
            </span>
            <span class="topbar__names">
              <span class="topbar__product">AI QA Release Risk Agent</span>
              <span class="topbar__kicker">Release Risk Workspace</span>
            </span>
          </div>
          <span class="topbar__spacer"></span>

          <span class="topbar__decision" id="hdr-decision"></span>

          <button
            class="topbar__btn"
            id="relaunch-btn"
            type="button"
            data-act="relaunch"
            aria-label="Relaunch to update"
            hidden
          >
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/>
            </svg>
            <span class="topbar__btn-label">Relaunch to update</span>
          </button>

          <div class="topbar__menu">
            <button
              class="topbar__btn"
              id="menu-btn"
              type="button"
              aria-haspopup="true"
              aria-expanded="false"
              aria-label="Demo and regression options"
            >
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <circle cx="12" cy="5" r="1" /><circle cx="12" cy="12" r="1" /><circle cx="12" cy="19" r="1" />
              </svg>
              <span class="topbar__btn-label">Demo / regression</span>
            </button>
            <div class="topbar__menu-list" id="menu-list" hidden role="menu">
              <span class="hint">Demo / Regression fixture</span>
              <button type="button" role="menuitem" data-act="run-demo">Run REQ-BEN-001 regression fixture</button>
              <button type="button" role="menuitem" data-act="load-example">Start from the worked example</button>
              <button type="button" role="menuitem" data-act="new">New blank assessment</button>
            </div>
          </div>
        </div>
      </header>

      <div class="wf-bar">
        <div class="container">
          <nav aria-label="Workflow stages">
            <ol class="wf-steps" id="topbar-steps">
              <li><button type="button" class="wf-step" data-step="context">
                <span class="wf-step__n"><span class="wf-step__digits">01</span></span>
                <span class="wf-step__text">
                  <span class="wf-step__label">Context</span>
                  <span class="wf-step__desc">Scope &amp; metadata</span>
                  <span class="wf-step__state"></span>
                </span>
              </button></li>
              <li><button type="button" class="wf-step" data-step="evidence">
                <span class="wf-step__n"><span class="wf-step__digits">02</span></span>
                <span class="wf-step__text">
                  <span class="wf-step__label">Evidence</span>
                  <span class="wf-step__desc">Tests &amp; known defects</span>
                  <span class="wf-step__state"></span>
                </span>
              </button></li>
              <li><button type="button" class="wf-step" data-step="analyze">
                <span class="wf-step__n"><span class="wf-step__digits">03</span></span>
                <span class="wf-step__text">
                  <span class="wf-step__label">Analyze</span>
                  <span class="wf-step__desc">AI risk analysis</span>
                  <span class="wf-step__state"></span>
                </span>
              </button></li>
              <li><button type="button" class="wf-step" data-step="review">
                <span class="wf-step__n"><span class="wf-step__digits">04</span></span>
                <span class="wf-step__text">
                  <span class="wf-step__label">Review</span>
                  <span class="wf-step__desc">Findings &amp; risk signals</span>
                  <span class="wf-step__state"></span>
                </span>
              </button></li>
              <li><button type="button" class="wf-step" data-step="decision">
                <span class="wf-step__n"><span class="wf-step__digits">05</span></span>
                <span class="wf-step__text">
                  <span class="wf-step__label">Decision</span>
                  <span class="wf-step__desc">Release decision</span>
                  <span class="wf-step__state"></span>
                </span>
              </button></li>
            </ol>
            <div class="wf-compact" id="wf-compact"></div>
          </nav>
        </div>
      </div>

      <main class="container app-main">
        <div id="view" aria-live="polite"><!-- rendered by app.js --></div>
      </main>

      <footer class="sitefoot">
        <div class="container">
          <p class="sitefoot__by">Created by Rizwana Zahoor | 2026</p>
        </div>
      </footer>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
